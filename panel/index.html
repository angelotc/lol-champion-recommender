<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick Recommender</title>
<style>
:root{
  --s:1;
  --bg:#010a13; --bg2:#0a1428; --panel:#091428; --line:#1e2328; --line2:#3c3c41;
  --gold:#c8aa6e; --gold2:#f0e6d2; --muted:#7b8793; --dim:#5b6570;
  --pos:#0ac8b9; --neg:#e84057; --bgalpha:1;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(16px * var(--s));}
html,body{height:100%;overflow:hidden;background:transparent}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  color:var(--gold2);font-size:.8125rem;line-height:1.25;
  background:linear-gradient(180deg,rgba(10,20,40,var(--bgalpha)),rgba(1,10,19,var(--bgalpha)) 40%);
  display:flex;flex-direction:column;height:100vh;
  border:1px solid var(--line2);user-select:none;-webkit-user-select:none;cursor:default;
}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:.5rem .625rem .375rem;border-bottom:1px solid var(--line);flex:none}
.hdr .t{font-variant:small-caps;letter-spacing:.08em;color:var(--gold);font-weight:600;font-size:.8125rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{background:none;border:1px solid transparent;color:var(--muted);font-size:1rem;line-height:1;width:1.375rem;height:1.375rem;border-radius:3px;cursor:pointer;flex:none}
.x:hover{color:var(--gold2);border-color:var(--line2)}
.team{padding:.5rem .625rem;border-bottom:1px solid var(--line);flex:none;display:flex;flex-direction:column;gap:.4375rem}
.row{display:flex;flex-wrap:wrap;gap:.25rem;align-items:flex-start;min-height:0}
.rlabel{width:100%;font-size:.5625rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.chip{display:flex;flex-direction:column;align-items:center;gap:1px}
.ico{position:relative;display:inline-block;flex:none;overflow:hidden;background:#1a2433;border-radius:50%;
  color:var(--gold);font-weight:700;text-align:center}
.ico img{display:block;width:100%;height:100%;object-fit:cover}
.ico .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.6em}
.ally .ico{width:2.25rem;height:2.25rem;border:2px solid #4a5a6a;border-radius:6px}
.ally.tent .ico{opacity:.5;border:2px dashed var(--gold)}
.ally.me .ico{border:2px solid var(--gold);box-shadow:0 0 0 2px rgba(200,170,110,.35)}
.enemy .ico{width:2.25rem;height:2.25rem;border:2px solid #7a2a36;border-radius:6px;background:#2a1218}
.enemy .ico img{filter:saturate(.9)}
.lane{font-size:.5625rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.bans .ico{width:1.375rem;height:1.375rem;border-radius:4px;border:1px solid var(--line2)}
.bans .ico img{filter:grayscale(1) brightness(.8)}
.bans .row{gap:.1875rem}
.bans{flex-direction:row;align-items:center;gap:.375rem}
.bans .rlabel{width:auto}
.recs{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:.375rem .5rem;display:flex;flex-direction:column;gap:.3125rem}
.recs::-webkit-scrollbar{width:4px}.recs::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
.rec{background:rgba(9,20,40,.75);border:1px solid var(--line);border-radius:5px;padding:.375rem .4375rem;cursor:pointer;flex:none;transition:border-color .15s,background .15s}
.rec:hover,.rec.open{background:rgba(16,30,56,.9);border-color:var(--line2)}
.rec.top{border-color:var(--gold);box-shadow:0 0 .5rem rgba(200,170,110,.35),inset 0 0 .375rem rgba(200,170,110,.12)}
.main{display:flex;align-items:center;gap:.4375rem}
.rank{width:.875rem;text-align:center;color:var(--dim);font-weight:700;font-size:.75rem;flex:none}
.top .rank{color:var(--gold)}
.rec .ico.big{width:3rem;height:3rem;border-radius:6px;border:1px solid var(--line2)}
.top .ico.big{border-color:var(--gold)}
.mid{flex:1;min-width:0}
.name{font-weight:600;font-size:.9375rem;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:flex;flex-direction:column;gap:1px;margin-top:2px}
.c{display:flex;align-items:center;gap:.1875rem;font-size:.6875rem;color:var(--muted);white-space:nowrap;overflow:hidden}
.c .ico{width:.9375rem;height:.9375rem;border-radius:3px}
.c .d{font-weight:600}
.c .n{overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.score{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;flex:none;text-align:right}
.detail{display:none;margin-top:.375rem;padding-top:.3125rem;border-top:1px solid var(--line)}
.rec:hover .detail,.rec.open .detail{display:block}
table{width:100%;border-collapse:collapse;font-size:.6875rem;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--dim);text-align:right;font-size:.5625rem;text-transform:uppercase;letter-spacing:.05em;padding:0 .125rem .125rem}
th:first-child,th:nth-child(2){text-align:left}
td{padding:.125rem;text-align:right;color:var(--muted);white-space:nowrap}
td:first-child,td:nth-child(2){text-align:left}
td.ch{display:flex;align-items:center;gap:.25rem;color:var(--gold2);max-width:6.5rem;overflow:hidden}
td.ch .ico{width:1.125rem;height:1.125rem;border-radius:3px}
td.ch span.n{overflow:hidden;text-overflow:ellipsis}
tr.tent td{opacity:.6}
.base{margin-top:.25rem;font-size:.6875rem;color:var(--muted);display:flex;justify-content:space-between}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem;color:var(--muted);text-align:center;padding:1rem}
.dot{width:.625rem;height:.625rem;border-radius:50%;background:var(--gold);animation:pulse 1.8s ease-in-out infinite}
.err .dot{background:var(--neg)}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.foot{flex:none;padding:.3125rem .625rem;border-top:1px solid var(--line);font-size:.5625rem;color:var(--dim);text-align:center}
.hidden{display:none!important}
/* overlay mode */
body.overlay{--bgalpha:.85;font-size:.75rem}
body.overlay .bans{display:none}
body.overlay .hdr{padding:.25rem .5rem}
body.overlay .team{padding:.3125rem .5rem;gap:.25rem}
body.overlay .rlabel{display:none}
body.overlay .ally .ico,body.overlay .enemy .ico{width:1.875rem;height:1.875rem}
body.overlay .rec .ico.big{width:2.25rem;height:2.25rem}
body.overlay .rec{padding:.25rem .375rem}
body.overlay .name{font-size:.8125rem}
body.overlay .score{font-size:1.0625rem}
body.overlay .foot{padding:.1875rem}
body.overlay .recs{gap:.1875rem;padding:.25rem .375rem}
.tiers{display:flex;justify-content:center;padding:.375rem .625rem;border-bottom:1px solid var(--line);flex:none}
.pill{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:2px;background:rgba(0,0,0,.25)}
.pill button{background:none;border:0;border-radius:999px;color:var(--muted);font:inherit;font-size:.6875rem;font-weight:600;
  letter-spacing:.04em;padding:.1875rem .625rem;cursor:pointer;transition:background .15s,color .15s}
.pill button:hover{color:var(--gold2)}
.pill button.on{background:var(--gold);color:#010a13}
.pill button:disabled{cursor:wait}
.note{font-size:.625rem;color:var(--muted);text-align:center;padding:.25rem .625rem 0}
body.overlay .tiers{padding:.1875rem .5rem}
</style>
</head>
<body>
<div class="hdr"><div class="t" id="title">Pick Recommender</div><button class="x" id="hide" title="Hide">&times;</button></div>
<div class="tiers hidden" id="tiersBox"><div><div class="pill" id="tiers"></div><div class="note hidden" id="note"></div></div></div>
<div class="team" id="team">
  <div><div class="rlabel">Allies</div><div class="row" id="allies"></div></div>
  <div><div class="rlabel">Enemies</div><div class="row" id="enemies"></div></div>
  <div class="bans" id="bansBox"><div class="rlabel">Bans</div><div class="row" id="bans"></div></div>
</div>
<div class="recs" id="recs"></div>
<div class="empty hidden" id="empty"><div class="dot"></div><div id="msg"></div></div>
<div class="foot" id="foot">Data: lolalytics &middot; last update --:--:--</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var LANES={top:"top",jungle:"jg",jg:"jg",middle:"mid",mid:"mid",bottom:"bot",bot:"bot",adc:"bot",support:"sup",utility:"sup",sup:"sup"};
  var openSet={};
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function lane(l){return l?(LANES[String(l).toLowerCase()]||String(l).slice(0,3)):""}
  function icon(name,url,cls){
    var w=el("span","ico"+(cls?" "+cls:""));
    var fb=el("span","fb",String(name||"?").replace(/[^A-Za-z0-9]/g,"").slice(0,2));
    w.appendChild(fb);
    if(url){var im=document.createElement("img");im.alt="";im.loading="lazy";
      im.onerror=function(){im.remove()};
      im.onload=function(){fb.remove()};
      im.src=url;w.appendChild(im);}
    return w;
  }
  function fmt(v,d){var n=Number(v);if(!isFinite(n))return"-";return(n>0?"+":"")+n.toFixed(d==null?1:d)}
  function cls(v){return Number(v)>=0?"pos":"neg"}
  function clear(n){while(n.firstChild)n.removeChild(n.firstChild)}
  function short(n){n=String(n||"");return n.length>8?n.slice(0,7)+"…":n}
  function cap(s){s=String(s||"");return s.charAt(0).toUpperCase()+s.slice(1)}

  function chipRow(box,list,kind){
    clear(box);
    (list||[]).forEach(function(c){
      var ch=el("div","chip "+kind+(c.tentative?" tent":"")+(c.is_me?" me":""));
      ch.title=c.name+(c.lane?" ("+c.lane+")":"");
      ch.appendChild(icon(c.name,c.icon));
      if(kind==="enemy")ch.appendChild(el("div","lane",lane(c.lane)));
      box.appendChild(ch);
    });
  }
  function contrib(c){
    var d=el("div","c");
    d.appendChild(el("span","d "+cls(c.weighted),fmt(c.weighted)));
    d.appendChild(el("span",null,c.kind==="vs"?"vs":"w/"));
    d.appendChild(icon(c.name,c.icon));
    d.appendChild(el("span","n",short(c.name)));
    return d;
  }
  function detail(r){
    var box=el("div","detail"),t=document.createElement("table");
    var h=document.createElement("tr");
    ["","Champ","Lane","Δ","Games","Wtd"].forEach(function(x,i){if(i===0)return;h.appendChild(el("th",null,x))});
    // columns: kind+champ merged -> use kind in first col
    clear(h);["Kind","Champ","Lane","Δ","Games","Wtd"].forEach(function(x){h.appendChild(el("th",null,x))});
    t.appendChild(h);
    (r.contributions||[]).forEach(function(c){
      var tr=document.createElement("tr");if(c.tentative)tr.className="tent";
      tr.appendChild(el("td",null,c.kind==="vs"?"vs":"w/"));
      var td=el("td","ch");td.appendChild(icon(c.name,c.icon));td.appendChild(el("span","n",c.name));tr.appendChild(td);
      tr.appendChild(el("td",null,lane(c.lane)));
      tr.appendChild(el("td",cls(c.delta),fmt(c.delta)));
      tr.appendChild(el("td",null,c.games!=null?String(c.games):"-"));
      tr.appendChild(el("td",null,fmt(c.weighted)));
      t.appendChild(tr);
    });
    box.appendChild(t);
    var b=el("div","base");b.appendChild(el("span",null,"Base"));b.appendChild(el("span",null,fmt(r.base,2)));
    box.appendChild(b);
    return box;
  }
  function renderRecs(recs){
    var box=$("recs");clear(box);
    (recs||[]).forEach(function(r,i){
      var d=el("div","rec"+(i===0?" top":"")+(openSet[r.name]?" open":""));
      var m=el("div","main");
      m.appendChild(el("div","rank",String(i+1)));
      m.appendChild(icon(r.name,r.icon,"big"));
      var mid=el("div","mid");mid.appendChild(el("div","name",r.name));
      var sub=el("div","sub");
      (r.contributions||[]).slice(0,2).forEach(function(c){sub.appendChild(contrib(c))});
      mid.appendChild(sub);m.appendChild(mid);
      m.appendChild(el("div","score "+cls(r.score),fmt(r.score,2)));
      d.appendChild(m);d.appendChild(detail(r));
      d.addEventListener("click",function(){
        if(openSet[r.name]){delete openSet[r.name];d.classList.remove("open")}
        else{openSet[r.name]=1;d.classList.add("open")}
      });
      box.appendChild(d);
    });
  }
  function pad(n){return(n<10?"0":"")+n}
  var pending=null;
  function renderTiers(s){
    var box=$("tiers");
    $("tiersBox").classList.toggle("hidden",!(s.tiers&&s.tiers.length));
    if(pending&&pending===s.tier_id)pending=null;
    clear(box);
    (s.tiers||[]).forEach(function(t){
      var b=el("button",(pending||s.tier_id)===t.id?"on":null,t.label);
      b.disabled=!!pending;
      b.addEventListener("click",function(){
        if(pending||t.id===s.tier_id)return;
        pending=t.id;renderTiers(s);
        try{window.pywebview.api.set_tier(t.id)}catch(e){pending=null;renderTiers(s)}
      });
      box.appendChild(b);
    });
    $("note").textContent=s.note||"";
    $("note").classList.toggle("hidden",!s.note);
  }

  window.updateState=function(s){
    s=s||{};
    var active=s.status==="active";
    var parts=[];
    if(s.role)parts.push(cap(s.role));if(s.days!=null&&s.days!=="")parts.push(s.days+"d");
    $("title").textContent=parts.length?parts.join(" · "):"Pick Recommender";
    renderTiers(s);
    $("team").classList.toggle("hidden",!active);
    $("recs").classList.toggle("hidden",!active);
    var em=$("empty");em.classList.toggle("hidden",active);
    em.classList.toggle("err",s.status==="error");
    $("msg").textContent=s.message||(s.status==="error"?"Error":"Waiting for champ select...");
    if(active){
      chipRow($("allies"),s.allies,"ally");
      chipRow($("enemies"),s.enemies,"enemy");
      clear($("bans"));$("bansBox").classList.toggle("hidden",!(s.bans&&s.bans.length));
      (s.bans||[]).forEach(function(b){var i=icon(b.name,b.icon);i.title=b.name;$("bans").appendChild(i)});
      var keep=$("recs").scrollTop;renderRecs(s.recs);$("recs").scrollTop=keep;
    }
    var n=new Date();
    $("foot").textContent="Data: lolalytics · last update "+pad(n.getHours())+":"+pad(n.getMinutes())+":"+pad(n.getSeconds());
  };
  window.setScale=function(v){v=parseFloat(v);if(isFinite(v)&&v>0)document.documentElement.style.setProperty("--s",v)};
  window.setMode=function(m){
    document.body.classList.toggle("overlay",m==="overlay");
    document.body.dataset.mode=m||"";
  };
  $("hide").addEventListener("click",function(){
    try{window.pywebview&&window.pywebview.api&&window.pywebview.api.hide&&window.pywebview.api.hide()}catch(e){}
  });

  /* dev fallback */
  setTimeout(function(){
    if(window.pywebview||location.search.indexOf("demo")<0)return;
    var q=new URLSearchParams(location.search);
    if(q.get("scale"))window.setScale(q.get("scale"));
    if(q.get("mode"))window.setMode(q.get("mode"));
    var I=function(id){return"https://ddragon.leagueoflegends.com/cdn/16.21.1/img/champion/"+id+".png"};
    var C=function(n,id,k,l,d,g,w,t){return{kind:k,name:n,icon:I(id),lane:l,delta:d,games:g,weighted:w,tentative:!!t}};
    var rec=function(n,id,sc,base,cs){return{name:n,icon:I(id),score:sc,base:base,contributions:cs}};
    window.updateState({
      status:"active",role:"support",tier:"Master+",days:14,tier_id:q.get("tier")||"master_plus",note:q.get("tier")==="challenger"?"Few matchups at this tier: scores lean on overall win rate.":"",tiers:[{id:"master_plus",label:"Master+"},{id:"grandmaster_plus",label:"GM+"},{id:"challenger",label:"Challenger"}],
      allies:[{name:"Jinx",icon:I("Jinx"),lane:"bottom",tentative:false,is_me:false},
              {name:"Lee Sin",icon:I("LeeSin"),lane:"jungle",tentative:true,is_me:false},
              {name:"Me",icon:"",lane:"support",tentative:false,is_me:true}],
      enemies:[{name:"Nautilus",icon:I("Nautilus"),lane:"support"},{name:"Caitlyn",icon:I("Caitlyn"),lane:"bottom"},{name:"Ahri",icon:I("Ahri"),lane:"middle"}],
      bans:[{name:"Pyke",icon:I("Pyke")},{name:"Blitzcrank",icon:I("Blitzcrank")}],
      recs:[
        rec("Leona","Leona",5.57,1.99,[C("Nautilus","Nautilus","vs","support",4.8,431,2.4),C("Jinx","Jinx","with","bottom",2.2,310,1.1),C("Caitlyn","Caitlyn","vs","bottom",1.3,520,0.9),C("Lee Sin","LeeSin","with","jungle",0.6,140,0.2,true),C("Ahri","Ahri","vs","middle",-0.5,260,-0.2)]),
        rec("Braum","Braum",4.12,1.50,[C("Caitlyn","Caitlyn","vs","bottom",3.1,388,1.6),C("Jinx","Jinx","with","bottom",1.9,402,0.9),C("Nautilus","Nautilus","vs","support",0.8,300,0.3)]),
        rec("Rell","Rell",3.40,1.20,[C("Nautilus","Nautilus","vs","support",2.7,290,1.3),C("Jinx","Jinx","with","bottom",1.4,250,0.7)]),
        rec("Thresh","Thresh",2.85,1.45,[C("Jinx","Jinx","with","bottom",1.8,610,0.9),C("Ahri","Ahri","vs","middle",0.9,330,0.4)]),
        rec("Nami","Nami",1.92,0.80,[C("Jinx","Jinx","with","bottom",2.0,480,1.0),C("Nautilus","Nautilus","vs","support",-1.2,350,-0.6)]),
        rec("Rakan","Rakan",0.75,0.30,[C("Caitlyn","Caitlyn","vs","bottom",0.9,270,0.4),C("Nautilus","Nautilus","vs","support",-0.7,260,-0.3)]),
        rec("Milio","Milio",-0.40,0.60,[C("Nautilus","Nautilus","vs","support",-2.2,180,-0.9),C("Jinx","Jinx","with","bottom",1.1,200,0.5)]),
        rec("Lulu","Lulu",-1.35,0.10,[C("Nautilus","Nautilus","vs","support",-3.0,410,-1.5),C("Caitlyn","Caitlyn","vs","bottom",-1.4,360,-0.7)])
      ]});
  },500);
})();
</script>
</body>
</html>
