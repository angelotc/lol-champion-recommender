<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoL Companion</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div class="hdr"><div class="t" id="title">LoL Companion</div><span class="btns"><button class="x" id="gear" title="Settings">&#9881;</button><button class="x" id="hide" title="Hide">&times;</button></span></div>
<div class="tiers hidden" id="tiersBox"><div><div class="pill" id="tiers"></div><div class="note hidden" id="note"></div></div></div>
<div class="tabs hidden" id="tabs"></div>

<section class="view hidden" data-view="picks">
  <div class="odds hidden" id="odds"></div>
  <div class="team" id="team">
    <div><div class="rlabel">Allies</div><div class="row" id="allies"></div></div>
    <div><div class="rlabel">Enemies <span id="enemyHint"></span></div><div class="row" id="enemies"></div>
      <div class="lanepick hidden" id="lanePick"></div></div>
    <div class="bans" id="bansBox"><div class="rlabel">Bans</div><div class="row" id="bans"></div></div>
  </div>
  <div class="locked hidden" id="locked"></div>
  <div class="recs" id="recs"></div>
</section>

<section class="view hidden" data-view="bans">
  <div class="team">
    <div><div class="rlabel">Allies</div><div class="row" id="banAllies"></div></div>
    <div class="bans" id="banBansBox"><div class="rlabel">Banned</div><div class="row" id="banBans"></div></div>
    <div class="vsline" id="banPicks"></div>
  </div>
  <div class="recs" id="threats"></div>
</section>

<section class="view hidden" data-view="build">
  <div class="bhead" id="bHead"></div>
  <div class="recs bbody" id="bBody"></div>
</section>

<section class="view hidden" data-view="ingame">
  <div class="recs igbody" id="igBody"></div>
</section>

<section class="view" data-view="status">
  <div class="empty" id="empty"><div class="dot"></div><div id="msg"></div><div class="sdetail" id="sdetail"></div></div>
</section>

<div class="foot" id="foot">Data: lolalytics &middot; last update --:--:--</div>
<script src="js/core.js"></script>
<script src="views/status.js"></script>
<script src="views/picks.js"></script>
<script src="views/bans.js"></script>
<script src="views/build.js"></script>
<script src="views/ingame.js"></script>
<script src="js/demo.js"></script>
</body>
</html>
