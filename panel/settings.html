<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoL Companion &mdash; Settings</title>
<link rel="stylesheet" href="settings.css">
</head>
<body>
<main id="form">
  <section>
    <h2>Picks</h2>
    <div class="f tog" data-f="comfort_weight"><label for="use_comfort">Use my record and mastery</label>
      <input type="checkbox" id="use_comfort" class="sw">
      <p class="hint">Favor champions you win with and have mastery on.</p><p class="err"></p></div>
    <div class="f tog" data-f="comfort_only"><label for="comfort_only">Only champions I've played</label>
      <input type="checkbox" id="comfort_only" class="sw">
      <p class="hint">Hide champions you have no games or mastery on.</p><p class="err"></p></div>
    <div class="f" data-f="min_pick_rate"><label for="min_pick_rate">Minimum pick rate %</label>
      <input type="number" id="min_pick_rate" min="0" max="5" step="0.5">
      <p class="hint">Lower it to include off-meta picks (0&ndash;5).</p><p class="err"></p></div>
  </section>
  <details id="adv">
    <summary>Advanced</summary>
    <div class="f wide" data-f="lockfile"><label for="lockfile">Lockfile path</label>
      <input type="text" id="lockfile" spellcheck="false">
      <p class="hint">Only if League isn't installed in the default folder. Used the next time the client connects.</p><p class="err"></p></div>
    <a href="#" id="openFile" class="link">Open config file (all other options)</a>
  </details>
  <p id="version" class="ver"></p>
</main>
<footer>
  <span id="status"></span>
  <button id="reset" class="ghost">Reset to defaults</button>
  <button id="cancel" class="ghost">Close</button>
  <button id="save" class="primary">Save</button>
</footer>
<script src="settings.js"></script>
</body>
</html>
