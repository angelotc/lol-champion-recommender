[project]
name = "league-analysis"
version = "0.1.0"
description = "Live champ select pick recommender using the League client API and lolalytics stats"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pillow>=13.0.0",
    "pystray>=0.19.5",
    "pywebview>=5",
    "tomlkit>=0.15.2",
    "velopack>=1.2.161",
    "websockets>=15",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = ["pytest>=8"]

[tool.uv]
package = false
