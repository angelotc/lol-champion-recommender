# League champ-select pick recommender config

# Picks are scored for the role you're assigned in champ select, using that role's pool below.
tier = "master_plus"
# Rolling window in days (not a specific patch)
days = 14
queue = "ranked"
region = "all"
# Shrinkage constant: deltas are scaled by games / (games + k)
k = 500
# Multiplier applied to synergy with allies that are only hovering
tentative_factor = 0.5
top_n = 8
lockfile = 'C:\Riot Games\League of Legends\lockfile'

# Candidate pool per role (lolalytics slugs or champion names); only these are ranked
[pools]
top = ["aatrox", "ksante", "renekton", "jax", "camille", "gnar", "ornn", "darius", "garen", "sion"]
jungle = ["leesin", "viego", "jarvaniv", "xinzhao", "vi", "graves", "kindred", "sejuani", "maokai", "khazix"]
middle = ["ahri", "syndra", "orianna", "sylas", "yone", "azir", "viktor", "akali", "taliyah", "galio"]
bottom = ["jinx", "kaisa", "ezreal", "caitlyn", "jhin", "ashe", "varus", "xayah", "zeri", "smolder"]
support = ["thresh", "nautilus", "leona", "lulu", "nami", "milio", "karma", "braum", "rell", "rakan"]

# Weights default per role: your lane opponent counts most, bot/support also weigh the enemy
# duo and their own duo partner, jungle matters to every lane. Override per role, e.g.:
#
# [weights.support]
# base = 1.0
# enemy = { support = 1.0, bottom = 1.0, jungle = 0.5, middle = 0.4, top = 0.3 }
# ally = { bottom = 1.0, jungle = 0.5, middle = 0.4, top = 0.3 }
